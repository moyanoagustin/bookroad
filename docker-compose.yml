version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bookroad-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
      POSTGRES_DB: ${DB_NAME:-bookroad}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookroad-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-bookroad}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-secret}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
